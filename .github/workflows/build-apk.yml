name: Build and Release UniFeed APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        # 不再安装系统 gradle（8.10），统一用项目 wrapper ./gradlew 构建；
        # setup-gradle 只负责依赖缓存
      - name: Restore fixed debug keystore
        run: |
          mkdir -p signing
          echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > signing/unifeed-debug.keystore
      - name: Get version
        id: version
        run: echo "tag=v0.1.${{ github.run_number }}" >> $GITHUB_OUTPUT
      - name: Bump version
        run: |
          sed -i "s/versionCode = .*/versionCode = ${{ github.run_number }}/" app/build.gradle.kts
          sed -i "s/versionName = \".*\"/versionName = \"${{ steps.version.outputs.tag }}\"/" app/build.gradle.kts
          grep -n "versionCode\|versionName" app/build.gradle.kts
      - name: Build Debug APK
        # 用项目 wrapper 构建；显式禁用 configuration cache，
        # 避免缓存的配置在 keystore 缺失时走回落分支（签名漂移根因之一）
        run: ./gradlew assembleDebug --no-configuration-cache
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "UniFeed ${{ steps.version.outputs.tag }}"
          body: "自动构建版本"
          files: app/build/outputs/apk/debug/app-debug.apk
